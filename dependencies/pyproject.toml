[project]
name = "poetry-torch-cuda"
version = "0.1.0"
description = ""
authors = [
    {name = "shorouq.zahra",email = "shorouq.zahra@ri.se"}
]
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "transformers (>=4.57.3,<5.0.0)",
    "torch (>=2.7.1,<3.0.0)",
    "pygments (>=2.19.2,<3.0.0)",

]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "torch"
url = "https://download.pytorch.org/whl/cu118/"
priority = "explicit"

[tool.poetry.dependencies]
torch = {source = "torch"}
